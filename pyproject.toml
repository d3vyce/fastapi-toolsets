[project]
name = "fastapi-toolsets"
version = "5.0.0"
description = "Production-ready utilities for FastAPI applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "d3vyce", email = "contact@d3vyce.fr" }
]
keywords = ["fastapi", "sqlalchemy", "postgresql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.urls]
Homepage = "https://github.com/d3vyce/fastapi-toolsets"
Documentation = "https://fastapi-toolsets.d3vyce.fr/"
Repository = "https://github.com/d3vyce/fastapi-toolsets"
Issues = "https://github.com/d3vyce/fastapi-toolsets/issues"

[project.optional-dependencies]
cli = [
    "typer>=0.9.0",
]
metrics = [
    "prometheus_client>=0.20.0",
]
pytest = [
    "httpx>=0.25.0",
    "pytest-xdist>=3.0.0",
    "pytest>=8.0.0",
]
all = [
    "fastapi-toolsets[cli,metrics,pytest]",
]

[project.scripts]
manager = "fastapi_toolsets.cli.app:cli"

[dependency-groups]
dev = [
    {include-group = "tests"},
    {include-group = "docs"},
    {include-group = "docs-src"},
    "fastapi-toolsets[all]",
    "prek>=0.3.8",
    "ruff>=0.1.0",
    "ty>=0.0.1a0",
]
tests = [
    "async-lru>=1.0",
    "coverage>=7.0.0",
    "httpx>=0.25.0",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest>=8.0.0",
]
docs = [
    "mike",
    "mkdocstrings-python>=2.0.2",
    "zensical>=0.0.30",
]
docs-src = [
    "bcrypt>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["E712"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012", "RUF059", "SIM117", "DTZ001", "S110", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/fastapi_toolsets"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git", tag = "2.2.0+zensical-0.1.0" }
